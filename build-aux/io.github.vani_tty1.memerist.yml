app-id: io.github.vani_tty1.memerist
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: memerist
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: imagemagick
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --without-x
    sources:
      - type: archive
        url: https://github.com/ImageMagick/ImageMagick/archive/refs/tags/7.1.2-29.tar.gz
        sha256: b05924ad73c6932ba62c9b32f338f0619b90b767162c8b767f3566556187a284


  - name: memerist
    buildsystem: meson
    sources:
      - type: dir
        path: ..